[tool.poetry]
name = "gsr-challenge"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
packages = [{include = "gsr", from = "src"}] # IMPORTANT : this enables including the gsr package

[tool.poetry.dependencies]
python = "^3.9"
#tracklab = {path = "../tracklab", develop = true}
#easyocr = "^1.7.1"
