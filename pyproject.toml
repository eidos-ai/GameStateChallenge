#tracklab-calibration = {path = "plugins/calibration", develop = true}
#prtreid = {git = "https://github.com/VlSomers/prtreid"}
#mmocr = "^1.0.1"
#mmpose = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins.tracklab_plugin]
gsr_challenge = "gsr.config_finder:ConfigFinder" # IMPORTANT : this is the "magic" that enables tracklab to find the configs